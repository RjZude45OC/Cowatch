name: Build Installers
on:
  push:
    branches:
      - main
  workflow_dispatch:
  # A full (non-pre) release with a vX.Y.Z tag builds that version and
  # attaches its installers to the release; that is what the in-app updater
  # offers. "released" covers both a new release and a prerelease that is
  # edited into a full one. The build-N prereleases are test builds only.
  release:
    types: [released]

permissions:
  contents: write

# A release build carries its tag's version (v1.2.3 -> 1.2.3) in the app and
# the installers. Test builds stay at 1.0 and carry no version, so they never
# self-update.
env:
  TAG_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || '1.0' }}

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Work out the version
        shell: bash
        run: |
          v="${TAG_VERSION#v}"
          if [ "$GITHUB_EVENT_NAME" = release ]; then
            if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Release tags must look like v1.2.3, got '$TAG_VERSION'"; exit 1
            fi
            echo "COWATCH_VERSION=$v" >> "$GITHUB_ENV"
          fi
          echo "APP_VERSION=$v" >> "$GITHUB_ENV"

      - name: Build fat JAR with Maven
        shell: bash
        run: mvn -B package -DskipTests "-Dcowatch.version=${COWATCH_VERSION:-}"

      # Per-user install, so neither the first install nor a silent update
      # asks for admin rights. The upgrade UUID must never change, or MSI
      # stops treating a new build as an upgrade of the installed one.
      # The .exe is for first installs; the updater uses the .msi.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          foreach ($type in 'exe', 'msi') {
            jpackage `
              --input target `
              --main-jar cowatch-client-1.0.0.jar `
              --main-class com.cowatch.client.Launcher `
              --name cowatch `
              --app-version $env:APP_VERSION `
              --win-per-user-install `
              --win-upgrade-uuid c5c90dff-9704-4829-a2c2-13c76c565c14 `
              --win-dir-chooser `
              --win-shortcut `
              --win-menu `
              --icon src/main/resources/icons/icon.ico `
              --type $type `
              --dest dist
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
        shell: pwsh

      # The .deb installs system-wide and updates through a password prompt.
      # The tarball can be unpacked anywhere the user owns and updates silently.
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          jpackage \
            --input target \
            --main-jar cowatch-client-1.0.0.jar \
            --main-class com.cowatch.client.Launcher \
            --name cowatch \
            --app-version "$APP_VERSION" \
            --icon src/main/resources/icons/icon.png \
            --linux-shortcut \
            --type deb \
            --dest dist
          jpackage \
            --input target \
            --main-jar cowatch-client-1.0.0.jar \
            --main-class com.cowatch.client.Launcher \
            --name cowatch \
            --app-version "$APP_VERSION" \
            --icon src/main/resources/icons/icon.png \
            --type app-image \
            --dest appimage
          tar -czf "dist/cowatch-$APP_VERSION-linux-x64.tar.gz" -C appimage cowatch

      - name: Package (macOS)
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: 10.14
        run: |
          jpackage \
            --input target \
            --main-jar cowatch-client-1.0.0.jar \
            --main-class com.cowatch.client.Launcher \
            --name cowatch \
            --app-version "$APP_VERSION" \
            --icon src/main/resources/icons/icon.icns \
            --type dmg \
            --dest dist

      - name: Upload to test prerelease
        if: github.event_name != 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build #${{ github.run_number }}"
          files: dist/*
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach to the published release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Renaming a test prerelease into a release keeps that build's 1.0 files
  # next to the real ones. Once every installer is attached, drop any file
  # that isn't named with this release's version.
  clean-release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Remove test-build files from the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          v="${TAG#v}"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' |
          while read -r name; do
            case "$name" in
              *"$v"*) ;;
              *) echo "Removing $name"; gh release delete-asset "$TAG" "$name" --repo "$GITHUB_REPOSITORY" --yes ;;
            esac
          done
