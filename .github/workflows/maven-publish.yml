name: Build Installers
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build fat JAR with Maven
        run: mvn -B package -DskipTests

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          jpackage `
            --input target `
            --main-jar syncplay-client-1.0.0.jar `
            --main-class com.syncplay.client.Launcher `
            --name SyncPlay `
            --app-version 1.0 `
            --win-dir-chooser `
            --win-shortcut `
            --win-menu `
            --type exe `
            --dest dist
        shell: pwsh

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          jpackage \
            --input target \
            --main-jar syncplay-client-1.0.0.jar \
            --main-class com.syncplay.client.Launcher \
            --name SyncPlay \
            --app-version 1.0 \
            --type deb \
            --dest dist

      - name: Package (macOS)
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: 10.14
        run: |
          jpackage \
            --input target \
            --main-jar syncplay-client-1.0.0.jar \
            --main-class com.syncplay.client.Launcher \
            --name SyncPlay \
            --app-version 1.0 \
            --type dmg \
            --dest dist

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build #${{ github.run_number }}"
          files: dist/*
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
