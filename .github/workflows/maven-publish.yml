name: Build Installers

on:
  push:
    tags:
      - 'v*'          # trigger on version tags: git tag v1.0 && git push --tags
  workflow_dispatch:  # or trigger manually from GitHub Actions tab

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build fat JAR with Maven
        run: mvn -B package -DskipTests

      # ── Windows ──────────────────────────────────────────────────
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          jpackage `
            --input target `
            --main-jar syncplay-client-1.0.0.jar `
            --main-class com.syncplay.client.Launcher `
            --name SyncPlay `
            --app-version 1.0 `
            --win-console `
            --type exe `
            --dest dist
        shell: pwsh

      # ── Linux ────────────────────────────────────────────────────
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          jpackage \
            --input target \
            --main-jar syncplay-client-1.0.0.jar \
            --main-class com.syncplay.client.Launcher \
            --name SyncPlay \
            --app-version 1.0 \
            --type deb \
            --dest dist

      # ── macOS ────────────────────────────────────────────────────
      - name: Package (macOS)
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: 10.14
        run: |
          jpackage \
            --input target \
            --main-jar syncplay-client-1.0.0.jar \
            --main-class com.syncplay.client.Launcher \
            --name SyncPlay \
            --app-version 1.0 \
            --type dmg \
            --dest dist

      # ── Upload artifact ──────────────────────────────────────────
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SyncPlay-${{ runner.os }}
          path: dist/*
